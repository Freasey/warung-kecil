<!DOCTYPE html>
<html lang="id">
<head>
  <title>Kasir Warung Mini</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px;}
    .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
    input { width: 90%; padding: 8px; margin-bottom: 10px; }
    button { padding: 10px; width: 100%; background: blue; color: white; border: none; cursor: pointer; }
    .total-box { margin-top: 20px; padding: 10px; background: #eee; font-weight: bold; text-align: center; }
    .diskon { color: green; font-size: 12px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🛒 Kasir Warung Mini</h2>
    
    <form id="formKasir">
      <input type="text" id="namaBarang" placeholder="Nama Barang (Cth: Sabun)" required>
      <input type="number" id="hargaBarang" placeholder="Harga (Cth: 5000)" required>
      <button type="submit">Tambah ke Keranjang</button>
    </form>

    <hr>
    
    <h3>Daftar Belanja:</h3>
    <ul id="daftarBelanja">
      </ul>

    <div class="total-box">
      <p>Total: Rp <span id="totalHarga">0</span></p>
      <p id="pesanDiskon" class="diskon"></p>
    </div>
  </div>

  <script>
	const keranjang = []
    const formKasir = document.querySelector('#formKasir')
    const namaBarang = document.querySelector('#namaBarang')
    const hargaBarang = document.querySelector('#hargaBarang')
    const daftarBelanja = document.querySelector('#daftarBelanja')
    const totalHarga = document.querySelector('#totalHarga')
    const pesanDiskon = document.querySelector('#pesanDiskon')
    
    formKasir.addEventListener("submit", function(event) {
      // Mencegah halaman refresh
      event.preventDefault();
      const itemBaru = {
      	nama: namaBarang.value,
        harga: Number(hargaBarang.value)
      }
      keranjang.push(itemBaru)
      const listItem = document.createElement("li");
      daftarBelanja.appendChild(listItem)
      listItem.textContent = `${itemBaru.nama} - ${itemBaru.harga}`;
      
      // Logika total
      let total = keranjang.reduce((total, item) => {
        return total + item.harga;
      }, 0);
      totalHarga.textContent = total
      
      // Diskon
      if (total > 100000){
        total = total - (total * 0.1)
        pesanDiskon.textContent = "Selamat! Dapat Diskon 10% 🎉"
      };
      namaBarang.value = "";
      hargaBarang.value = "";
    });
    
  </script>
</body>
</html>
